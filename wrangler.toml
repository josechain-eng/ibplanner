# AVISO (13-sep-2026): este worker NO declara [vars] a proposito.
# Todo lo sensible va como SECRET (wrangler secret put), nunca como variable de
# texto plano en el dashboard: un `wrangler deploy` desde aca reemplaza el
# conjunto de vars por el de este archivo y borra las que no esten declaradas.
# Asi se perdieron OPENAI_API_KEY y JINA_API_KEY. Los secrets SI sobreviven.
# Secrets esperados: ANTHROPIC_API_KEY, OPENAI_API_KEY, BRIEFING_KEY (+ JINA_API_KEY opcional).

name = "life-planner"
main = "worker.js"
compatibility_date = "2024-11-06"

kv_namespaces = [
  { binding = "LBP_KV", id = "308c3def2b0e468798011665598009a2" }
]

[[r2_buckets]]
binding = "LBP_R2"
bucket_name = "lbp-files"

[triggers]
crons = ["* * * * *"]

# Llamada interna al worker del Briefing Diario (para leer los correos de
# Ventura). Un fetch a su URL publica de workers.dev desde aca devuelve 404;
# el service binding va worker-a-worker sin salir a internet.
[[services]]
binding = "BRIEFING_SERVICE"
service = "briefing-diario-pepe"
